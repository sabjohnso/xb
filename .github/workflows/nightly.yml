name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libexpat1-dev libcurl4-openssl-dev ninja-build

      - name: Configure
        run: cmake --preset ci -Dxb_BUILD_INTEGRATION_TESTS=ON

      - name: Build
        run: cmake --build build-ci --config Release

      - name: Test
        run: ctest --test-dir build-ci -C Release --output-on-failure
