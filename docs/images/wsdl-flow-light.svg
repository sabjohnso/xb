<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="680" height="140">
  <style>
    .box { rx: 8; ry: 8; stroke-width: 2; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #111; }
    .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #666; }
  </style>
  <defs><marker id="arrowL" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs>
  <!-- WSDL inputs -->
  <rect class="box" x="10" y="10" width="160" height="110" fill="#ddeeff" stroke="#336699"/>
  <text class="label" x="90" y="38" text-anchor="middle" font-weight="bold">WSDL 1.1</text>
  <text class="sublabel" x="90" y="55" text-anchor="middle">document</text>
  <line x1="60" y1="72" x2="60" y2="82" stroke="#336699" stroke-width="1" stroke-dasharray="4"/>
  <text class="label" x="90" y="96" text-anchor="middle" font-weight="bold">WSDL 2.0</text>
  <text class="sublabel" x="90" y="113" text-anchor="middle">description</text>
  <!-- Arrows to Service IR -->
  <line x1="170" y1="40" x2="230" y2="62" stroke="#666" stroke-width="2" marker-end="url(#arrowL)"/>
  <line x1="170" y1="100" x2="230" y2="78" stroke="#666" stroke-width="2" marker-end="url(#arrowL)"/>
  <!-- Service IR -->
  <rect class="box" x="240" y="20" width="180" height="90" fill="#d4edda" stroke="#28a745"/>
  <text class="label" x="330" y="55" text-anchor="middle" font-weight="bold">Service IR</text>
  <text class="sublabel" x="330" y="75" text-anchor="middle">(resolved)</text>
  <!-- Arrow to output -->
  <line x1="420" y1="65" x2="470" y2="65" stroke="#666" stroke-width="2" marker-end="url(#arrowL)"/>
  <!-- Generated output -->
  <rect class="box" x="480" y="15" width="185" height="100" fill="#fff3cd" stroke="#997700"/>
  <text class="label" x="572" y="42" text-anchor="middle">Client stubs</text>
  <text class="label" x="572" y="62" text-anchor="middle">Server skeleton</text>
  <text class="label" x="572" y="82" text-anchor="middle">Support utils</text>
</svg>
